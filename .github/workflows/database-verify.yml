name: Database verification

on:
  # Keep a manual fallback, and verify automatically when database-related
  # changes reach production through main.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/database-verify.yml"
      - "drizzle/**"
      - "drizzle.config.ts"
      - "scripts/verify-database.mjs"
      - "src/lib/db/schema.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: database-verification-main
  cancel-in-progress: false

jobs:
  verify-neon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Neon schema and persistence safeguards
        run: npm run db:verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
